<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Integration of DNA methylation and RNA-seq data in IntOGen</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-omics" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c05621"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="350" fill="#ffffff"/>

  <!-- mutation-based analysis -->
  <g fill="#e8f0fe" stroke="#2b6cb0" stroke-width="1.5">
    <rect x="20" y="30" width="150" height="50" rx="8"/>
    <rect x="210" y="30" width="150" height="50" rx="8"/>
    <rect x="420" y="30" width="150" height="50" rx="8"/>
    <rect x="630" y="30" width="150" height="50" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1a202c">
    <text x="95" y="52">Somatic</text><text x="95" y="68">mutations</text>
    <text x="285" y="52">Driver identification</text><text x="285" y="68">methods (7)</text>
    <text x="495" y="52">Combination</text><text x="495" y="68">(Schulze, Stouffer)</text>
    <text x="705" y="52">Driver discovery</text><text x="705" y="68">(vetting, features)</text>
  </g>

  <!-- omics -->
  <g fill="#fdf2e9" stroke="#c05621" stroke-width="1.5">
    <rect x="20" y="150" width="150" height="50" rx="8"/>
    <rect x="20" y="250" width="150" height="50" rx="8"/>
    <rect x="210" y="150" width="150" height="50" rx="8"/>
    <rect x="210" y="250" width="150" height="50" rx="8"/>
    <rect x="420" y="160" width="150" height="130" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1a202c">
    <text x="95" y="172">DNA methylation</text><text x="95" y="188">(array beta values)</text>
    <text x="95" y="280">RNA-seq</text>
    <text x="285" y="172">Epigenetic silencing</text><text x="285" y="188">(recurrence test)</text>
    <text x="285" y="272">Expression: expressed</text><text x="285" y="288">genes, outliers</text>
    <text x="495" y="212">Omics features</text>
    <text x="495" y="232" font-size="11" fill="#4a5568">mutant vs wild-type</text>
    <text x="495" y="247" font-size="11" fill="#4a5568">expression, mutation +</text>
    <text x="495" y="262" font-size="11" fill="#4a5568">hypermethylation, role</text>
  </g>

  <!-- solid arrows -->
  <g stroke="#4a5568" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="170" y1="55" x2="208" y2="55"/>
    <line x1="360" y1="55" x2="418" y2="55"/>
    <line x1="570" y1="55" x2="628" y2="55"/>
    <line x1="780" y1="55" x2="808" y2="55"/>
    <line x1="170" y1="175" x2="208" y2="175"/>
    <line x1="170" y1="275" x2="208" y2="275"/>
    <line x1="285" y1="250" x2="285" y2="202"/>
    <line x1="360" y1="175" x2="418" y2="175"/>
    <line x1="360" y1="275" x2="418" y2="275"/>
    <polyline points="95,80 95,115 495,115 495,158"/>
    <polyline points="570,225 705,225 705,82"/>
    <line x1="495" y1="290" x2="495" y2="318"/>
  </g>
  <text x="293" y="230" font-size="11" fill="#4a5568">functional</text>
  <text x="293" y="243" font-size="11" fill="#4a5568">silencing</text>

  <!-- optional integration in the combination -->
  <g stroke="#c05621" stroke-width="1.5" stroke-dasharray="6 4" fill="none">
    <polyline points="360,160 390,160 390,68 418,68" marker-end="url(#arrow-omics)"/>
    <polyline points="360,262 390,262 390,160"/>
  </g>

  <!-- labels -->
  <g fill="#1a202c">
    <text x="812" y="60">drivers.tsv</text>
    <text x="495" y="338" text-anchor="middle">omics.tsv</text>
    <text x="715" y="140" font-size="12">(1) expression filter</text>
    <text x="715" y="158" font-size="12">(2) omics annotations</text>
    <text x="398" y="103" font-size="12" fill="#c05621">(3) integrative mode (optional)</text>
  </g>
</svg>
