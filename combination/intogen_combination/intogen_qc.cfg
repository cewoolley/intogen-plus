
[oncodriveclustl]
     ENSEMBL_ID = ENSID
     GENE_ID = SYMBOL
     PVALUE = P_ANALYTICAL
     QVALUE = Q_ANALYTICAL

[dndscv]
    GENE_ID = gene_name
    PVALUE = pallsubs_cv
    QVALUE = qallsubs_cv

[oncodrivefml]
    ENSEMBL_ID = GENE_ID
    GENE_ID = SYMBOL
    PVALUE = P_VALUE
    QVALUE = Q_VALUE
    MUTS = MUTS
    SAMPLES = SAMPLES

[hotmaps]
    GENE_ID = GENE
    PVALUE = Min p-value
    QVALUE = q-value

[smregions]
     GENE_ID = HUGO_SYMBOL
     PVALUE = P_VALUE
     QVALUE = Q_VALUE
     ENSEMBL_ID = REGION

[cbase]
     GENE_ID = gene
     PVALUE = p_pos
     QVALUE = q_pos

[mutpanning]
    GENE_ID = Name
    PVALUE = Significance
    QVALUE = FDR

# Omics-based methods: only used when provided (integrative mode).
# Their rankings are restricted to the candidate genes of the mutational analysis.

[methylation]
    GENE_ID = SYMBOL
    PVALUE = P_VALUE
    QVALUE = Q_VALUE
    OPTIONAL = True
    RESTRICT_TO_CANDIDATES = True

[expression]
    GENE_ID = SYMBOL
    PVALUE = P_VALUE
    QVALUE = Q_VALUE
    OPTIONAL = True
    RESTRICT_TO_CANDIDATES = True
